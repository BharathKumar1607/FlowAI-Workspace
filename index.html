<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FlowAI Workspace - Single Page Application (SPA) Simulation. Dynamic client-side routing, state management, and seamless transitions.">
    <title>FlowAI Workspace - Single Page Application (SPA)</title>
    
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <!-- 1. ACCESSIBILITY: Skip to Main Content Link -->
    <a href="#app-view" class="skip-link">Skip to main content</a>

    <!-- ARIA Live Announcer for Screen Readers -->
    <div id="aria-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- 2. TOP NAVBAR (Semantic Header & SPA Navigation Landmark) -->
    <header class="navbar" role="banner">
        <a href="#/chat" class="logo" aria-label="FlowAI Workspace SPA Home">
            <svg class="fluid-logo" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <rect width="36" height="36" rx="8" fill="#0B57D0"/>
                <path d="M11 12H25M11 18H21M11 24H17" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="logo-meta">
                <span class="logo-title">FlowAI</span>
                <span class="spa-badge">SPA</span>
            </div>
        </a>
        
        <!-- SPA Client-Side Navigation -->
        <nav aria-label="Main SPA Navigation" role="navigation">
            <ul class="nav-links" id="nav-links">
                <li><a href="#/chat" class="nav-link active" data-route="/chat" aria-current="page">💬 Chat</a></li>
                <li><a href="#/prompts" class="nav-link" data-route="/prompts">💡 Prompts</a></li>
                <li><a href="#/history" class="nav-link" data-route="/history">🕒 History</a></li>
                <li><a href="#/settings" class="nav-link" data-route="/settings">⚙️ Settings</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <!-- Accessible Theme Toggle Button -->
            <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Color Theme">
                <span id="theme-icon" aria-hidden="true">🌙</span>
            </button>
            
            <!-- Mobile Menu Toggle Button -->
            <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu">
                <span class="bar" aria-hidden="true"></span>
                <span class="bar" aria-hidden="true"></span>
                <span class="bar" aria-hidden="true"></span>
            </button>
        </div>
    </header>

    <!-- 3. MAIN APP LAYOUT (CSS Grid) -->
    <div class="app-layout" id="app-layout">
        
        <!-- SIDEBAR (Always available or conditionally toggled by view) -->
        <aside class="sidebar" id="app-sidebar" role="complementary" aria-label="Sidebar Sessions">
            <button id="new-chat-btn" class="new-chat-btn" accesskey="n" aria-label="Start new chat session (Shortcut: Alt+N)">
                <span aria-hidden="true">+</span> New Chat <kbd class="kbd-shortcut" aria-hidden="true">Alt+N</kbd>
            </button>
            
            <section class="sidebar-section" aria-labelledby="sessions-heading">
                <div class="sidebar-section-header">
                    <h2 id="sessions-heading" class="sidebar-title">Recent Conversations</h2>
                    <span id="session-count" class="badge" aria-label="Saved sessions count">0</span>
                </div>
                <!-- Dynamic Session List Rendered by app.js -->
                <ul id="sidebar-sessions" class="session-list" role="list"></ul>
            </section>

            <div class="sidebar-footer">
                <div class="model-badge" role="status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="active-model-display">Gemini 2.5 Flash</span>
                </div>
            </div>
        </aside>

        <!-- 4. SPA DYNAMIC VIEW CONTAINER (Client-Side Router Mount Target) -->
        <main id="app-view" class="spa-view-container" role="main" tabindex="-1">
            <!-- Dynamic view components (Chat, Prompts, History, Settings) mounted here by app.js -->
        </main>

    </div>

    <!-- 5. GLOBAL MODAL CONTAINER -->
    <div id="app-modal-root"></div>

    <!-- 6. TOAST NOTIFICATION CONTAINER (ARIA Live Region) -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- 7. FOOTER (Contentinfo Landmark) -->
    <footer class="footer" role="contentinfo">
        <p>&copy; 2026 FlowAI Workspace &bull; Week 5 Single Page Application (SPA) &bull; Built by Bharath Kumar</p>
    </footer>
</body>
</html>
